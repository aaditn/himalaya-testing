[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "g1-four-limb-climb"
version = "0.1.0"
description = "MuJoCo Playground task for four-limb Unitree G1 climbing on steep rough terrain"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "playground>=0.2.0",
  "jax>=0.6",
  "mujoco>=3.6.0",
  "mujoco-mjx>=3.6.0",
  "brax>=0.14.2",
  "huggingface-hub>=1.8.0",
  "mediapy>=1.2",
  "imageio-ffmpeg>=0.6",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["himalaya"]

[tool.hatch.build.targets.wheel.force-include]
"assets/unitree_g1" = "himalaya/assets/unitree_g1"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
