# The physical hand, declared once. The simulator and the live tools all read
# this file. Lengths are millimetres; hub frame is +x right, +y down the image,
# -z toward the camera.
#
# Tag ids confirmed against the built hand, 2026-08-30. Camera POV, reference tag
# at the bottom on the blue cuff, fingers extending upward away from it:
#
#     [0]  [2]  [4]     <- farther from the cuff: tip
#     [1]  [3]  [5]     <- closer to the cuff: base
#          [11]         <- rigid reference on the cuff
#
# tag_ids are listed root to tip, so each pair reads [base, tip].
hand:
  name: compliant_passive_v1
  dictionary: DICT_4X4_50
  tag_mm: 18.0
  press_direction: [0.0, 0.0, 1.0]
  zero_samples: 30
  max_missing_frames: 8

  # Single tag on the rigid blue cuff. One tag means any occlusion invalidates
  # the whole frame - add a second and third when the mount allows.
  reference:
    ids: [11]
    face: [0.0, 0.0, -1.0]

  fingers:
    - name: left
      tag_ids: [1, 0]          # base (lower), tip (upper)
      stations_mm: [24.0, 58.0]
      base_mm: [-26.0, 0.0, 0.0]
      axis: [0.0, -1.0, 0.0]
      length_mm: 104.8
      face: [0.0, 0.0, -1.0]
      bend_dir: [0.0, 0.0, -1.0]

    - name: middle
      tag_ids: [3, 2]          # base (lower), tip (upper)
      stations_mm: [24.0, 58.0]
      base_mm: [0.0, 0.0, 0.0]
      axis: [0.0, -1.0, 0.0]
      length_mm: 104.8
      face: [0.0, 0.0, -1.0]
      bend_dir: [0.0, 0.0, -1.0]

    - name: right
      tag_ids: [5, 4]          # base (lower), tip (upper)
      stations_mm: [24.0, 58.0]
      base_mm: [26.0, 0.0, 0.0]
      axis: [0.0, -1.0, 0.0]
      length_mm: 104.8
      face: [0.0, 0.0, -1.0]
      bend_dir: [0.0, 0.0, -1.0]

# Signed bend thresholds, in degrees, for grip classification.
# wrap_sign depends on which face the tags are stuck to and cannot be derived
# from geometry. CALIBRATED 2026-08-30 on the built hand: with tags on this face
# a genuine wrapping grip produces negative signed bend, so the sign is -1.
# Thresholds are set in millimetres of tip travel and converted with
# flexsense.grip.bend_deg_for_tip_travel, which is pure cantilever geometry and
# so does not depend on how stiff the flexure turns out to be. For tags at
# 24/58 mm on a 104.8 mm finger:
#   wrap_deg     4.5  =  14 mm of tip travel
#   backbend_deg 4.0  =  12.5 mm of tip travel
grip:
  neutral_deg: 3.0
  wrap_deg: 4.5
  backbend_deg: 4.0
  wrap_sign: -1.0

# The finger's CAD, used to render its real shape bending live. STL carries no
# units, so they are sniffed (this one is inches) unless declared. length_mm
# overrides the CAD length when the printed part differs - this printer scales
# to about 93.3%, so measure the real finger and put the number here.
mesh:
  path: assets/finger_v2.stl
  units: auto
  face_sign: 1
  # The swept profile's own faces are the wide ones, but the tags are stuck on
  # the narrow 20 mm side wall, a quarter turn round the long axis from there.
  # -90 rather than +90 puts them on the straighter of the two side walls.
  roll_deg: -90

camera:
  position_mm: [0.0, -20.0, -130.0]
  look_at_mm: [0.0, -25.0, 0.0]
  up: [0.0, -1.0, 0.0]
  width: 1280
  height: 720
  intrinsics: calibration/camera_intrinsics.json
