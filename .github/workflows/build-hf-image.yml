name: Build pinned Hugging Face runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.hf
      - requirements-hf.txt
      - .github/workflows/build-hf-image.yml

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hf
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/himalaya-hf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
      - name: Record immutable launch reference
        run: |
          echo 'Use this exact image in the HF submitter:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/himalaya-hf@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
