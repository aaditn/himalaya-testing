# G1 23-DOF rough-terrain locomotion config.
# Single source of truth. Every knob that a run might vary lives here.

robot:
  urdf: assets/g1/g1_23dof.urdf
  num_dof: 23
  # 12 leg + 1 waist_yaw + 10 arm. NOTE: this variant has waist YAW ONLY
  # (no waist pitch/roll), so torso balance authority is limited --
  # relevant to the arms-for-balance question.
  arm_joints: [
    left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint,
    left_elbow_joint, left_wrist_roll_joint,
    right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint,
    right_elbow_joint, right_wrist_roll_joint,
  ]

control:
  policy_hz: 50
  physics_hz: 200
  action_type: joint_position_targets   # NOT torque; PD absorbs high-freq stability
  action_scale: 0.25

policy:
  # [512,256,128] ELU -- converged across 4 independent sources in the research pass.
  # Explicitly NOT the 32-unit layers that unitree_rl_gym ships for G1.
  hidden_dims: [512, 256, 128]
  activation: elu
  # Encoder is swappable. Start mlp; flip to gru without touching the obs space.
  encoder: mlp        # mlp | gru

observation:
  # 1.0 s of history at 50 Hz. Deliberately generous -- retrofitting history
  # depth after the obs space is baked is painful, and 4-5 frames is the
  # flat/mild-rough answer, not the rough-terrain answer.
  history_len: 50
  history_stride: 1
  terms: [joint_pos, joint_vel, base_ang_vel, projected_gravity, last_action, commands]

ppo:
  num_envs: 4096
  rollout_steps: 24
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005     # sweep 0.005-0.01. 0.001 excluded: slows early exploration.
  learning_rate: 1.0e-3
  schedule: adaptive
  clip: 0.2
  epochs: 5
  minibatches: 4

rewards:
  # Weights are the tuning surface. Log EVERY term separately -- one term at
  # 100x the others is the most common failure and is invisible in the sum.
  track_lin_vel: 1.0
  track_ang_vel: 0.5
  alive: 0.15
  orientation: -1.0
  energy: -2.0e-4
  joint_limits: -1.0
  self_collision: -1.0
  foot_clearance: 0.5
  # Angular-momentum regularization: exp(-||L_base||_2 / 5).
  # Wired in but ZEROED for the arms-free baseline. Flip to ~0.3 if arms go
  # slack. Having it pre-wired costs nothing and avoids a mid-project refactor.
  angular_momentum: 0.0

randomization:
  # Robustness, not sim-to-real. Sim-only project -- no actuator/sensor/latency
  # randomization until (unless) hardware enters the picture.
  # Friction is on from the FLAT stage, not deferred to terrain.
  friction_flat: [0.7, 1.1]
  friction_terrain: [0.4, 1.2]
  push_interval_s: 5.0
  push_vel: 0.8
  mass_jitter: 0.10
  randomize_init_state: true

terrain:
  # Continuous rough ground -- NOT sparse footholds.
  # Step heights ramp 3cm -> 10cm. The 4cm figure is a curriculum starting
  # point, not a ceiling; capping there leaves performance on the table.
  # Proportions are humanoid-calibrated, NOT legged_gym's quadruped 60% stairs.
  num_levels: 10
  num_cols: 20
  proportions:
    flat: 0.10
    rough_noise: 0.30
    slope: 0.30
    stairs: 0.20
    discrete_obstacles: 0.10
  step_height_range: [0.03, 0.10]
  slope_range_deg: [0.0, 25.0]
  noise_amplitude_range: [0.01, 0.06]
  promote_frac: 0.8    # advance level if >80% of commanded distance tracked
  demote_frac: 0.5     # drop level if <50%

killswitch:
  # Lenient by default. Aggressive thresholds are opt-in via --strict-kill,
  # because a NEW reward config has no baseline curve to compare against and
  # tracking reward can stay flat longer than you'd think and still recover.
  enabled: true
  strict: false
  checks:
    - {at_min: 2,  metric: steps_per_sec,  min: 100000, strict_only: false}
    - {at_min: 15, metric: episode_length, min: 60,     strict_only: true}
    - {at_min: 30, metric: track_lin_vel,  min: 0.15,   strict_only: true}
    - {at_min: 60, metric: track_lin_vel,  min: 0.35,   strict_only: false}
